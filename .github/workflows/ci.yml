name: CI

# 全 PR で依存のインストール・テスト・ビルドを実行する。デプロイはしない (build-deploy.yml の役割)。
# ビルドには BASE_PATH などを渡さず、src/build.js の既定値を使う。
# ジョブ test は main の必須チェック。トリガーにフィルタを付けない (フィルタで起動しなかった PR では必須チェックが報告されず、マージできなくなる)。
on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 10

      - run: npm test

      - run: npm run build
