name: CI

# Installs dependencies, runs the tests and builds on every PR. Does not deploy (that is build-deploy.yml's role).
# The build is given no BASE_PATH or the like and uses src/build.js's defaults.
# The job test is a required check on main. The trigger has no filter (on a PR that a filter kept from starting, the required check would not be reported and the PR could not be merged).
on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 10

      - run: npm test

      - run: npm run build
