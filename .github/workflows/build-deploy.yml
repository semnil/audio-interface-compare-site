name: Build & Deploy to GitHub Pages

on:
  # 手動トリガー
  workflow_dispatch:
  # ビルド結果に影響するファイル更新時に自動ビルド
  push:
    paths:
      - "data/audio_interfaces.xlsx"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-deploy.yml"
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
        timeout-minutes: 10

      # BASE_PATH を渡してビルド
      # カスタムドメインなら "/" 、repo pages なら "/repo-name/" になる
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
