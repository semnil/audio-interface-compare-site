name: Workflow checks (default branch)

# Runs the contract tests for .github/workflows/ and action.yml / action.yaml (tests/workflow-*.test.js) on every PR.
# Runs on pull_request_target and uses the default branch's version of both the workflow definition and the tests (a PR cannot change the check that judges it).
# The PR's workflow and action files are fetched as data from the head commit through the GitHub API and placed in WORKFLOW_ROOT;
# the PR's code is neither checked out nor executed. Fails when this check's files (PROTECTED_PATTERN) do not match the default branch
# Each gh api call is made up to three times, ten seconds apart, and the fetch step fails on a call whose third
# attempt failed.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  workflow-tests-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Fetch the pull request's workflow and action files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROTECTED_PATTERN: '^(\.github/workflows/workflow-checks-main\.yml|tests/workflow-[^/]+\.test\.js)$'
        run: |
          # Makes a gh api call up to three times, ten seconds apart, writes what the attempt that succeeded
          # printed to the file named first, and fails when the third attempt failed.
          fetch() {
            local dest="$1" attempt
            shift
            for attempt in 1 2 3; do
              if gh api "$@" > "$RUNNER_TEMP/fetch.part"; then
                mv "$RUNNER_TEMP/fetch.part" "$dest"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::attempt ${attempt} of 3 failed, running it again in 10 seconds: gh api ${*: -1}"
                sleep 10
              fi
            done
            echo "::error::gh api ${*: -1} failed three times"
            return 1
          }
          src="$RUNNER_TEMP/pr-files"
          mkdir -p "$src"
          fetch "$RUNNER_TEMP/tree.json" "repos/${GITHUB_REPOSITORY}/git/trees/${HEAD_SHA}?recursive=1"
          truncated=$(yq -p=json '.truncated' "$RUNNER_TEMP/tree.json")
          if [ "$truncated" != "false" ]; then
            echo "::error::git tree listing of ${HEAD_SHA} is truncated (truncated=${truncated})"
            exit 1
          fi
          fetch "$RUNNER_TEMP/base-tree.json" "repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1"
          base_truncated=$(yq -p=json '.truncated' "$RUNNER_TEMP/base-tree.json")
          if [ "$base_truncated" != "false" ]; then
            echo "::error::git tree listing of ${GITHUB_SHA} is truncated (truncated=${base_truncated})"
            exit 1
          fi
          protected='.tree[] | select(.type == "blob" and (.path | test(env(PROTECTED_PATTERN)))) | [.path, .mode, .sha]'
          yq -p=json -o=tsv "$protected" "$RUNNER_TEMP/base-tree.json" | LC_ALL=C sort > "$RUNNER_TEMP/protected-base.tsv"
          yq -p=json -o=tsv "$protected" "$RUNNER_TEMP/tree.json" | LC_ALL=C sort > "$RUNNER_TEMP/protected-head.tsv"
          if [ ! -s "$RUNNER_TEMP/protected-base.tsv" ]; then
            echo "::error::no file on the default branch matches PROTECTED_PATTERN (${PROTECTED_PATTERN})"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/protected-base.tsv" "$RUNNER_TEMP/protected-head.tsv"; then
            echo "::error::the files of this check must be identical to the default branch (to change them, lift the required status check first)"
            diff "$RUNNER_TEMP/protected-base.tsv" "$RUNNER_TEMP/protected-head.tsv"
            exit 1
          fi
          yq -p=json -o=tsv '.tree[] | select(.path | (test("(?i)(^|/)action[.]ya?ml$") and (test("(^|/)action[.]ya?ml$") | not))) | .path' "$RUNNER_TEMP/tree.json" > "$RUNNER_TEMP/non-canonical.tsv"
          if [ -s "$RUNNER_TEMP/non-canonical.tsv" ]; then
            echo "::error::action file names must be lowercase action.yml / action.yaml (a case-insensitive file system opens these as action.yml)"
            cat "$RUNNER_TEMP/non-canonical.tsv"
            exit 1
          fi
          targets='.tree[] | select(.path | (test("^[.]github/workflows/[^/]+[.]ya?ml$") or test("(^|/)action[.]ya?ml$")))'
          yq -p=json -o=tsv "${targets} | select(.type != \"blob\" or (.mode != \"100644\" and .mode != \"100755\")) | [.path, .type, .mode]" "$RUNNER_TEMP/tree.json" > "$RUNNER_TEMP/non-regular.tsv"
          if [ -s "$RUNNER_TEMP/non-regular.tsv" ]; then
            echo "::error::workflow and action files must be regular files (symlinks and other entries are rejected)"
            cat "$RUNNER_TEMP/non-regular.tsv"
            exit 1
          fi
          yq -p=json -o=tsv "${targets} | [.path, .sha]" "$RUNNER_TEMP/tree.json" > "$RUNNER_TEMP/files.tsv"
          while IFS=$'\t' read -r path blob; do
            mkdir -p "$src/$(dirname "$path")"
            fetch "$src/$path" -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}"
          done < "$RUNNER_TEMP/files.tsv"
          yq -p=json -o=tsv '.tree[] | select(.mode == "160000" or .mode == "120000") | [(.path | split("/") | map((select(test("^[\x00-\x7f]*$")) | downcase) // "*") | join("/")), .path, .mode]' "$RUNNER_TEMP/tree.json" > "$RUNNER_TEMP/links.tsv"
          : > "$RUNNER_TEMP/local-refs.tsv"
          while IFS=$'\t' read -r path _; do
            if [[ "$path" =~ ^\.github/workflows/[^/]+\.ya?ml$ ]]; then
              (cd "$src" && yq '(.jobs[] | select(has("uses")) | .uses) | select(test("^[.$]/")) | filename + "	" + (line | tostring) + "	job	" + (test("^[.$]/[A-Za-z0-9._/-]*$") | tostring) + "	" + (. | @json)' "$path") >> "$RUNNER_TEMP/local-refs.tsv"
              (cd "$src" && yq '(.jobs[].steps[]? | select(has("uses")) | .uses) | select(test("^[.$]/")) | filename + "	" + (line | tostring) + "	step	" + (test("^[.$]/[A-Za-z0-9._/-]*$") | tostring) + "	" + (. | @json)' "$path") >> "$RUNNER_TEMP/local-refs.tsv"
            fi
            if [[ "$path" =~ (^|/)action\.ya?ml$ ]]; then
              (cd "$src" && yq '(.runs.steps[]? | select(has("uses")) | .uses) | select(test("^[.$]/")) | filename + "	" + (line | tostring) + "	step	" + (test("^[.$]/[A-Za-z0-9._/-]*$") | tostring) + "	" + (. | @json)' "$path") >> "$RUNNER_TEMP/local-refs.tsv"
            fi
          done < "$RUNNER_TEMP/files.tsv"
          : > "$RUNNER_TEMP/bad-local.txt"
          while IFS=$'\t' read -r file line kind valid json; do
            ref="${json#\"}"
            ref="${ref%\"}"
            reason=""
            if [ "$kind" = "step" ] && [[ "$ref" == ./* ]]; then
              reason="./ in a step resolves against the runner workspace; use \$/"
            elif [ "$valid" != "true" ]; then
              reason="characters other than A-Z a-z 0-9 . _ - /"
            else
              rel="${ref:2}"
              rel="${rel%/}"
              if [ -z "$rel" ]; then continue; fi
              lower=$(printf '%s' "$rel" | LC_ALL=C tr '[:upper:]' '[:lower:]')
              IFS=/ read -r -a parts <<< "$lower"
              depth=0
              for part in "${parts[@]}"; do
                case "$part" in
                  "" | *.) reason="non-canonical path"; break ;;
                esac
                depth=$((depth + 1))
                while IFS=$'\t' read -r lfold lpath lmode; do
                  IFS=/ read -r -a lparts <<< "$lfold"
                  if [ "${#lparts[@]}" -ne "$depth" ]; then continue; fi
                  match=1
                  for ((i = 0; i < depth; i++)); do
                    if [ "${lparts[$i]}" != "*" ] && [ "${lparts[$i]}" != "${parts[$i]}" ]; then match=0; break; fi
                  done
                  if [ "$match" = 1 ]; then
                    if [ "$lmode" = "160000" ]; then reason="submodule ${lpath}"; else reason="symlink ${lpath}"; fi
                    break
                  fi
                done < "$RUNNER_TEMP/links.tsv"
                if [ -n "$reason" ]; then break; fi
              done
            fi
            if [ -n "$reason" ]; then
              echo "${file}:${line}: ${json} (${reason})" >> "$RUNNER_TEMP/bad-local.txt"
            fi
          done < "$RUNNER_TEMP/local-refs.tsv"
          if [ -s "$RUNNER_TEMP/bad-local.txt" ]; then
            echo '::error::steps must reference same-repository actions with $/ (./ in a step resolves against the runner workspace), and local ./ and $/ uses must be a canonical path of A-Z a-z 0-9 . _ - characters that does not go through a symlink or into a submodule, compared case-insensitively (the referenced action.yml would not be checked)'
            cat "$RUNNER_TEMP/bad-local.txt"
            exit 1
          fi

      - run: node --test tests/workflow-*.test.js
        env:
          WORKFLOW_ROOT: ${{ runner.temp }}/pr-files
