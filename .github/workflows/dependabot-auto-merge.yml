name: Dependabot auto-merge

# Dependabot のプルリクエストを自動でマージするかを決める。更新が semver の patch なら、読んだ head コミットに固定して
# 自動マージ (merge commit) を予約する (古い head の実行が新しい head の予約を作れない)。それ以外の種別 (fetch-metadata が
# 読めなかった場合を含む) では、前の head で予約された自動マージを解除する。Dependabot の push では予約が外れず、rebase で
# patch が minor や major に変わることがある。Dependabot 以外のプルリクエストでは両ステップとも skip する。
# ジョブ auto-merge は main の必須チェックで、その head コミットについての判定が出るまでプルリクエストをマージさせない。
# そのため Dependabot の条件はジョブでなくステップに置き、トリガーにもフィルタを付けない (全 PR でジョブが結果を報告する)。
# 自動マージによるマージは GITHUB_TOKEN によるものとして扱われ、main への push はワークフローを起動しない (build-deploy.yml も走らない)。
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for a patch update, disable it otherwise
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ "$UPDATE_TYPE" = 'version-update:semver-patch' ]; then
            gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
          elif [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = 'true' ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
